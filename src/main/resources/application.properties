server.port=8080

# Oracle Database Configuration
#spring.datasource.url=jdbc:oracle:thin:@//127.0.0.1:1521/FREEPDB1
#spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1

spring.datasource.username=bewaesserung
spring.datasource.password=MeinSuperPasswort123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Beispiel für Hikari-Wartezeiten beim Start
spring.datasource.hikari.validation-timeout=5000
# Timeout beim Verbindungsaufbau erhöhen (z.B. auf 120 Sekunden)
spring.datasource.hikari.connection-timeout=120000

# Camunda anweisen, keine automatischen harten Schema-Updates beim Start zu machen, die den Pool sprengen
camunda.bpm.database.schema-update=false

# Verhindern, dass Hikari beim allerersten Start direkt hart fehlschlägt,
# falls die DB noch hochfährt (initialization fail timeout auf -1 oder längere Zeit)
spring.datasource.hikari.initialization-fail-timeout=-1

# Maximale Anzahl an Verbindungen im Pool (z.B. wenn alle Arduinos gleichzeitig feuern)
spring.datasource.hikari.maximum-pool-size=30

# Die Mindestanzahl an Verbindungen, die immer offen gehalten werden (deine "minimum, z.B. 5")
spring.datasource.hikari.minimum-idle=5

# Wie lange eine Verbindung im Leerlauf bleiben darf, bevor sie abgebaut wird (in ms)
spring.datasource.hikari.idle-timeout=120000

# Wie lange eine Verbindung maximal leben darf
spring.datasource.hikari.max-lifetime=1200000

# Optional: Falls Hibernate zu aggressiv beim Start prüft (gelöscht)

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Camunda Configuration
camunda.bpm.database.type=oracle
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.admin-user.firstName=Admin
camunda.bpm.filter.create=All Tasks
camunda.bpm.generic-properties.properties.historyTimeToLive=P30D
# Camunda-Schema-Validierung beim Start entschärfen (verhindert das Blockieren des Connection Pools)
camunda.bpm.database.schema-update=false
# camunda.bpm.generic-properties.properties.enforceHistoryTimeToLive=false

