<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bewässerung Mobil</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #22c55e;
            --accent-dark: #16a34a;
            --pause: #f59e0b;
            --info: #38bdf8;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            margin: 0;
            padding: 16px;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
        }

        select, input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text);
            font-size: 1rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .card h2 {
            font-size: 1rem;
            margin: 0 0 12px 0;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.85rem;
            background: #334155;
        }

        .badge.GIESSEN { background: rgba(34, 197, 94, 0.2); color: var(--accent); border: 1px solid var(--accent); }
        .badge.EINSICKERN { background: rgba(245, 158, 11, 0.2); color: var(--pause); border: 1px solid var(--pause); }
        .badge.FERTIG { background: rgba(56, 189, 248, 0.2); color: var(--info); border: 1px solid var(--info); }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: var(--muted);
            font-size: 0.92rem;
        }

        .value {
            font-weight: 700;
            font-size: 1rem;
        }

        .progress-wrap {
            width: 100%;
            height: 10px;
            background: #0f172a;
            border-radius: 999px;
            overflow: hidden;
            margin: 10px 0 4px 0;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.4s ease;
        }

        .field {
            margin-bottom: 12px;
        }

        .field label {
            display: block;
            font-size: 0.88rem;
            color: var(--muted);
            margin-bottom: 5px;
        }

        /* Stepper-Buttons (-2 / -0.5 / +0.5 / +2) */
        .stepper-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1.4fr 1fr 1fr;
            gap: 6px;
            align-items: center;
        }

        .stepper-row input {
            text-align: center;
            font-weight: 700;
            padding: 10px 4px;
        }

        .btn-step {
            padding: 10px 4px;
            background: #0f172a;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-step:active {
            background: #334155;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-save {
            background: #334155;
            color: var(--text);
        }

        .btn-start {
            background: var(--accent);
            color: #052e16;
        }

        .btn-start:active {
            background: var(--accent-dark);
        }

        .btn-geo {
            width: 100%;
            background: #0284c7;
            color: #f8fafc;
            margin-top: 8px;
        }

        .msg {
            margin-top: 10px;
            font-size: 0.88rem;
            color: var(--info);
            min-height: 1.2em;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Bewässerung Steuerung</h1>
        <span id="live-indicator" style="font-size:0.8rem; color:#94a3b8;">Auto-Refresh 5s</span>
    </header>

    <!-- Platzauswahl -->
    <div class="card">
        <div class="field" style="margin-bottom:0;">
            <label for="platz-select">Platz auswählen</label>
            <select id="platz-select" onchange="onPlatzWechsel()">
                <option value="21">Reihe 1 - Platz 1 (ID: 21)</option>
                <option value="22">Reihe 1 - Platz 2 (ID: 22)</option>
            </select>
        </div>
    </div>

    <!-- Live-Status -->
    <div class="card">
        <div class="status-bar">
            <h2 style="margin:0;">Aktueller Status</h2>
            <span id="zyklus-status" class="badge BEREIT">BEREIT</span>
        </div>

        <div class="row">
            <span class="label">Wassermenge (Ist / Soll)</span>
            <span class="value"><span id="ist-liter">0.0</span> / <span id="soll-liter-view">0.0</span> L</span>
        </div>
        <div class="progress-wrap">
            <div id="liter-progress" class="progress-bar"></div>
        </div>

        <div class="row">
            <span class="label">Nächste Einsicker-Abschaltung</span>
