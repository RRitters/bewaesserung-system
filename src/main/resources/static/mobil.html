<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bewässerung Mobil</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #22c55e;
            --pause: #f59e0b;
            --info: #38bdf8;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 10px; background: var(--bg); color: var(--text); }
        .container { max-width: 480px; margin: 0 auto; }

        .top-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        select, input {
            width: 100%; padding: 8px 10px; border-radius: 8px;
            border: 1px solid var(--border); background: #0f172a; color: var(--text); font-size: 0.95rem;
        }

        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px; margin-bottom: 10px;
        }

        .badge { padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 0.78rem; background: #334155; white-space: nowrap; }
        .badge.GIESSEN { background: rgba(34, 197, 94, 0.2); color: var(--accent); border: 1px solid var(--accent); }
        .badge.EINSICKERN { background: rgba(245, 158, 11, 0.2); color: var(--pause); border: 1px solid var(--pause); }
        .badge.FERTIG { background: rgba(56, 189, 248, 0.2); color: var(--info); border: 1px solid var(--info); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-box { background: #0f172a; border-radius: 8px; padding: 8px; }
        .stat-label { font-size: 0.75rem; color: var(--muted); }
        .stat-val { font-size: 0.95rem; font-weight: 700; margin-top: 2px; }

        .progress-wrap { width: 100%; height: 7px; background: #0f172a; border-radius: 999px; overflow: hidden; margin: 8px 0; }
        .progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s; }

        .field { margin-bottom: 8px; }
        .field label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 3px; }

        .stepper-row { display: grid; grid-template-columns: 1fr 1fr 1.3fr 1fr 1fr; gap: 5px; }
        .stepper-row input { text-align: center; font-weight: 700; padding: 8px 2px; }
        .btn-step {
            padding: 8px 2px; background: #0f172a; color: var(--text);
            border: 1px solid var(--border); border-radius: 8px; font-weight: 700; cursor: pointer;
        }

        .btn-group-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 6px; }
        .btn-group-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        button { padding: 9px 6px; border: none; border-radius: 8px; font-size: 0.88rem; font-weight: 700; cursor: pointer; }
        .btn-batch { background: #0f172a; color: var(--info); border: 1px solid var(--border); }
        .btn-save { background: #334155; color: var(--text); }
        .btn-start { background: var(--accent); color: #052e16; }
        .btn-geo { width: 100%; background: #0284c7; color: #fff; margin-top: 8px; }
        .msg { margin-top: 6px; font-size: 0.8rem; color: var(--info); min-height: 1.1em; }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <select id="platz-select" onchange="onPlatzWechsel()">
            <option value="21">Lade Plätze...</option>
        </select>
        <span id="zyklus-status" class="badge BEREIT">BEREIT</span>
    </div>

    <!-- Kompakte Live-Übersicht -->
    <div class="card">
        <div class="stat-label">Wassermenge (Ist / Soll)</div>
        <div class="stat-val"><span id="ist-liter">0.0</span> / <span id="soll-liter-view">0.0</span> L</div>
        <div class="progress-wrap"><div id="liter-progress" class="progress-bar"></div></div>

        <div class="grid-2">
            <div class="stat-box">
                <div class="stat-label">Nächster Stopp (Einsickern)</div>
                <div class="stat-val" id="naechste-abschaltung">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Einsickerpause (Ist / Soll)</div>
                <div class="stat-val"><span id="pause-ist">0</span> / <span id="pause-soll-view">15</span> Min</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Zyklen (Gießen / Pause)</div>
                <div class="stat-val"><span id="anzahl-bewaesserung">0</span> / <span id="anzahl-pause">0</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Soll-Durchfluss</div>
                <div class="stat-val"><span id="soll-lpm-view">0.0</span> l/min</div>
            </div>
        </div>
    </div>

    <!-- Sollwerte + Stepper + Batch -->
    <div class="card">
        <div class="field">
            <label>Soll-Durchfluss (l/min)</label>
            <div class="stepper-row">
                <button type="button" class="btn-step" onclick="aendereDurchfluss(-2)">-2</button>
                <button type="button" class="btn-step" onclick="aendereDurchfluss(-0.5)">-0,5</button>
                <input type="number" id="input-soll-lpm" step="0.5" min="0" max="30" />
                <button type="button" class="btn-step" onclick="aendereDurchfluss(0.5)">+0,5</button>
                <button type="button" class="btn-step" onclick="aendereDurchfluss(2)">+2</button>
            </div>
            <div class="btn-group-3">
                <button type="button" class="btn-batch" onclick="sendeDurchflussBatch('PLATZ')">Nur Platz</button>
                <button type="button" class="btn-batch" onclick="sendeDurchflussBatch('REIHE')">Ganze Reihe</button>
                <button type="button" class="btn-batch" onclick="sendeDurchflussBatch('ALLE')">Alle Plätze</button>
            </div>
        </div>

        <div class="grid-2">
            <div class="field">
                <label>Gesamt-Soll (L)</label>
                <input type="number" id="input-soll-liter" step="1" min="0" />
            </div>
            <div class="field">
                <label>Liter pro Puls (L)</label>
                <input type="number" id="input-puls-liter" step="1" min="0" />
            </div>
        </div>

        <div class="field">
            <label>Einsickerpause Sollwert (Minuten)</label>
            <input type="number" id="input-pause-soll" step="1" min="0" />
        </div>

        <div class="btn-group-2">
            <button type="button" class="btn-save" onclick="sendeSollwerte(false)">Speichern</button>
            <button type="button" class="btn-start" onclick="sendeSollwerte(true)">Neu starten</button>
        </div>
        <div id="status-msg" class="msg"></div>
    </div>

    <!-- Geo-Position -->
    <div class="card">
        <div class="grid-2">
            <div class="stat-box">
                <div class="stat-label">Lat / Lon (gespeichert)</div>
                <div class="stat-val" id="geo-coords">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">GPS-Genauigkeit</div>
                <div class="stat-val" id="geo-acc">-</div>
            </div>
        </div>
        <button type="button" class="btn-geo" onclick="erfasseUndSpeichereGeo()">GPS-Position erfassen & speichern</button>
        <div id="geo-msg" class="msg"></div>
    </div>
</div>

<script>
    let allePlaetze = [];
    let eingabenInitialisiert = false;

    function getAktuellePlatzId() {
        return document.getElementById("platz-select").value;
    }

    async function ladeAllePlaetze() {
        try {
            const res = await fetch("/api/plaetze");
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            allePlaetze = await res.json();
            allePlaetze.sort((a, b) => (a.id ?? 0) - (b.id ?? 0));

            const sel = document.getElementById("platz-select");
            const vorher = sel.value;
            sel.innerHTML = "";
            for (const p of allePlaetze) {
                const opt = document.createElement("option");
                opt.value = p.id;
                opt.textContent = `${p.name} (ID: ${p.id})`;
                sel.appendChild(opt);
            }
            if (vorher && allePlaetze.some(p => String(p.id) === String(vorher))) {
                sel.value = vorher;
            }
            zeigeGespeicherteGeo();
        } catch (err) {
            document.getElementById("status-msg").textContent = "Plätze konnten nicht geladen werden: " + err.message;
        }
    }

    function zeigeGespeicherteGeo() {
        const platzId = getAktuellePlatzId();
        const p = allePlaetze.find(x => String(x.id) === String(platzId));
        if (p && p.latitude != null && p.longitude != null) {
            document.getElementById("geo-coords").textContent = `${Number(p.latitude).toFixed(6)}, ${Number(p.longitude).toFixed(6)}`;
        } else {
            document.getElementById("geo-coords").textContent = "-";
        }
        document.getElementById("geo-acc").textContent = "-";
    }

    function onPlatzWechsel() {
        eingabenInitialisiert = false;
        document.getElementById("status-msg").textContent = "";
        document.getElementById("geo-msg").textContent = "";
        zeigeGespeicherteGeo();
        ladePlatzStatus();
    }

    function aendereDurchfluss(delta) {
        const input = document.getElementById("input-soll-lpm");
        const aktuell = parseFloat(input.value) || 0;
        const neu = Math.min(30, Math.max(0, Math.round((aktuell + delta) * 10) / 10));
        input.value = neu.toFixed(1);
    }

    async function ladePlatzStatus() {
        const platzId = getAktuellePlatzId();
        if (!platzId) return;
        try {
            const res = await fetch(`/api/platz-steuerung/${platzId}`);
            if (!res.ok) throw new Error(`Keine Steuerung für Platz ${platzId} (${res.status})`);
            const d = await res.json();

            const badge = document.getElementById("zyklus-status");
            badge.textContent = d.zyklusStatus;
            badge.className = `badge ${d.zyklusStatus}`;

            const istL = Number(d.istLiter ?? 0);
            const sollL = Number(d.sollLiter ?? 0);
            const stoppL = Number(d.naechsteAbschaltungLiter ?? 0);
            const rest = Math.max(0, stoppL - istL);

            document.getElementById("ist-liter").textContent = istL.toFixed(1);
            document.getElementById("soll-liter-view").textContent = sollL.toFixed(1);
            document.getElementById("liter-progress").style.width = `${sollL > 0 ? Math.min(100, (istL / sollL) * 100) : 0}%`;
            document.getElementById("naechste-abschaltung").textContent = stoppL > 0 ? `${stoppL.toFixed(1)} L (Rest ${rest.toFixed(1)})` : "-";
            document.getElementById("pause-ist").textContent = Number(d.einsickerpauseIstMin ?? 0).toFixed(0);
            document.getElementById("pause-soll-view").textContent = Number(d.einsickerpauseSollMin ?? 0).toFixed(0);
            document.getElementById("anzahl-bewaesserung").textContent = d.anzahlBewaesserung ?? 0;
            document.getElementById("anzahl-pause").textContent = d.anzahlPause ?? 0;
            document.getElementById("soll-lpm-view").textContent = Number(d.sollDurchflussLpm ?? 0).toFixed(1);

            if (!eingabenInitialisiert) {
                document.getElementById("input-soll-liter").value = sollL;
                document.getElementById("input-puls-liter").value = Number(d.pulsSollLiter ?? 0);
                document.getElementById("input-pause-soll").value = Number(d.einsickerpauseSollMin ?? 15);
                document.getElementById("input-soll-lpm").value = Number(d.sollDurchflussLpm ?? 16).toFixed(1);
                eingabenInitialisiert = true;
            }
        } catch (err) {
            document.getElementById("status-msg").textContent = err.message;
        }
    }

    async function sendeDurchflussBatch(scope) {
        const platzId = Number(getAktuellePlatzId());
        const lpm = parseFloat(document.getElementById("input-soll-lpm").value) || 0;
        const msgEl = document.getElementById("status-msg");
        try {
            const res = await fetch("/api/plaetze/soll-durchfluss/batch", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ platzId, scope, sollDurchflussLpm: lpm })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            await ladePlatzStatus();
            msgEl.textContent = `${data.aktualisiertePlaetze} Platz/Plätze (${scope}) auf ${data.sollDurchflussLpm.toFixed(1)} l/min gesetzt.`;
        } catch (err) {
            msgEl.textContent = "Batch-Fehler: " + err.message;
        }
    }

    async function sendeSollwerte(starteNeu) {
        const platzId = getAktuellePlatzId();
        const msgEl = document.getElementById("status-msg");
        const payload = {
            sollLiter: parseFloat(document.getElementById("input-soll-liter").value) || 0,
            pulsSollLiter: parseFloat(document.getElementById("input-puls-liter").value) || 0,
            einsickerpauseSollMin: parseFloat(document.getElementById("input-pause-soll").value) || 0,
            sollDurchflussLpm: parseFloat(document.getElementById("input-soll-lpm").value) || 0,
            starteNeu: starteNeu
        };
        try {
            const res = await fetch(`/api/platz-steuerung/${platzId}/sollwerte`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            eingabenInitialisiert = false;
            await ladePlatzStatus();
            msgEl.textContent = starteNeu ? "Neu gestartet!" : "Gespeichert!";
        } catch (err) {
            msgEl.textContent = "Speicherfehler: " + err.message;
        }
    }

    function erfasseUndSpeichereGeo(highAccuracy = true) {
        const platzId = getAktuellePlatzId();
        const geoMsg = document.getElementById("geo-msg");
        if (!navigator.geolocation) {
            geoMsg.textContent = "Kein GPS verfügbar.";
            return;
        }
        geoMsg.textContent = highAccuracy ? "Ermittle GPS (hochgenau)..." : "Ermittle Position (Netzwerk)...";
        navigator.geolocation.getCurrentPosition(
            async (pos) => {
                const lat = Number(pos.coords.latitude.toFixed(6));
                const lon = Number(pos.coords.longitude.toFixed(6));
                const acc = Math.round(pos.coords.accuracy);
                document.getElementById("geo-coords").textContent = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                document.getElementById("geo-acc").textContent = `± ${acc} m`;
                try {
                    const res = await fetch(`/api/plaetze/${platzId}/geo`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ latitude: lat, longitude: lon })
                    });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const p = allePlaetze.find(x => String(x.id) === String(platzId));
                    if (p) { p.latitude = lat; p.longitude = lon; }
                    geoMsg.textContent = "Geo-Position in PLATZ gespeichert.";
                } catch (err) {
                    geoMsg.textContent = "Position erfasst, Speichern fehlgeschlagen: " + err.message;
                }
            },
            (err) => {
                if (highAccuracy && err.code === 3) {
                    erfasseUndSpeichereGeo(false);
                    return;
                }
                geoMsg.textContent = "GPS-Fehler: " + err.message;
            },
            { enableHighAccuracy: highAccuracy, timeout: 20000, maximumAge: 30000 }
        );
    }

    (async () => {
        await ladeAllePlaetze();
        await ladePlatzStatus();
        setInterval(ladePlatzStatus, 5000);
    })();
</script>
</body>
</html>
