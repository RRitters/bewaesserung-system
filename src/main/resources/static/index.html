<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Bewässerungs-Dashboard</title>
  <!-- bpmn-js Viewer CSS & JS über CDN einbinden -->
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js/dist/assets/diagram-js.css" />
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js/dist/assets/bpmn-font/css/bpmn.css" />
  <script src="https://unpkg.com/bpmn-js/dist/bpmn-viewer.development.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #canvas {
      width: 100%;
      height: 500px;
      border: 1px solid #ccc;
      background-color: #f8f9fa;
    }
    .highlight-active:not(.djs-connection) .djs-visual > :nth-child(1) {
      stroke: #ff4d4d !important; /* Rote Rahmenfarbe */
      stroke-width: 3px !important;
      fill: #ffe6e6 !important;   /* Hellroter Hintergrund */
    }
  </style>
</head>
<body>

<h1>Prozess-Ansicht: Bewässerung</h1>

<!-- Dein bestehender BPMN-Viewer Container -->

<!-- 1. NEU: Das div für die Störungstabelle hier drunter setzen -->
<!-- Störungs- und Alarm-Monitor -->
<div style="margin-top: 30px; padding: 20px; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 5px;">
  <h3>System-Ereignisse & Störungen (Live)</h3>
  <table id="eventTable" style="width: 100%; border-collapse: collapse; margin-top: 10px;">
    <thead>
    <tr style="background: #e9ecef; text-align: left;">
      <th style="padding: 8px; border: 1px solid #dee2e6;">Zeitstempel (ms)</th>
      <th style="padding: 8px; border: 1px solid #dee2e6;">Kategorie</th>
      <th style="padding: 8px; border: 1px solid #dee2e6;">Gruppe</th>
      <th style="padding: 8px; border: 1px solid #dee2e6;">Platz</th>
      <th style="padding: 8px; border: 1px solid #dee2e6;">Meldung</th>
    </tr>
    </thead>
    <tbody id="eventTableBody">
    <!-- Wird dynamisch per JavaScript befüllt -->
    </tbody>
  </table>
</div>

<script>
  // Funktion zum Abrufen und Rendern der aktiven Alarme
  document.addEventListener("DOMContentLoaded", function() {
    async function fetchActiveEvents() {
      try {
        const response = await fetch('/api/events/active');
        if (!response.ok) return;
        const events = await response.json();

        const tbody = document.getElementById('eventTableBody');
        if (tbody === null) {
          return; // Verhindert den Fehler, wenn das Element fehlt
        }
        tbody.innerHTML = ''; // Tabelle leeren

        if (events.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="padding: 10px; text-align: center; color: #6c757d;">Keine aktiven Störungen. Anlage läuft stabil.</td></tr>';
          return;
        }

        events.forEach(event => {
          const row = document.createElement('tr');

          // Roter Hintergrund bei echten Fehlern
          if (event.category === 'FEHLER') {
            row.style.background = '#f8d7da';
          } else {
            row.style.background = '#fff3cd'; // Gelb/Orange bei Warnungen
          }

          // Exakter Zeitstempel (ISO-String mit Millisekunden)
          const formattedTime = new Date(event.timestamp).toISOString();

          row.innerHTML = `
                      <td style="padding: 8px; border: 1px solid #dee2e6; font-family: monospace;">${formattedTime}</td>
                      <td style="padding: 8px; border: 1px solid #dee2e6; font-weight: bold;">${event.category}</td>
                      <td style="padding: 8px; border: 1px solid #dee2e6;">${event.groupName}</td>
                      <td style="padding: 8px; border: 1px solid #dee2e6;">${event.plotId || '-'}</td>
                      <td style="padding: 8px; border: 1px solid #dee2e6;">${event.message}</td>
                  `;
          tbody.appendChild(row);
        });
      } catch (error) {
        console.error('Fehler beim Laden der Events:', error);
      }
    } // <-- Hier war vorher eine geschweifte Klammer zu viel

    // Beim Laden und alle 3 Sekunden aktualisieren (jetzt sauber innerhalb von DOMContentLoaded)
    fetchActiveEvents();
    setInterval(fetchActiveEvents, 3000);
  });
</script>

<script>
  // 1. Viewer initialisieren
  const viewer = new BpmnJS({ container: '#canvas' });

  async function loadDiagram() {
    try {
      // BPMN-Datei laden
      const response = await fetch('/bewaesserung.bpmn');
      const xml = await response.text();

      // 2. WICHTIG: Warten, bis das XML vollständig eingelesen ist
      await viewer.importXML(xml);

      // Zoom anpassen
      viewer.get('canvas').zoom('fit-viewport');

      // 3. Erst JETZT (nach dem Laden) den Marker auf das Element setzen
      const canvas = viewer.get('canvas');

      // Hier kommt die saubere ID hin (ohne _di!)
      canvas.addMarker('Activity_Sensoren', 'highlight-active');

      console.log("Diagramm geladen und Element 'Activity_Sensoren' markiert.");

    } catch (err) {
      console.error('Fehler beim Laden des Diagramms:', err);
    }
  }

  loadDiagram();
</script>
</body>
</html>
